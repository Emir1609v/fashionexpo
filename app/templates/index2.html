<script>
  function openModal(src) {
    document.getElementById('modalImage').src = src;
    document.getElementById('imageModal').classList.remove('hidden');
    document.getElementById('imageModal').classList.add('flex');
  }

  function closeModal() {
    document.getElementById('imageModal').classList.add('hidden');
    document.getElementById('imageModal').classList.remove('flex');
  }

  function aanmelden(button) {
    const container = button.closest('[data-max]');
    const max = parseInt(container.getAttribute("data-max"));
    let count = parseInt(container.getAttribute("data-count"));

    if (count < max) {
      count++;
      container.setAttribute("data-count", count);
      container.querySelector(".count").textContent = count;
      if (count === max) {
        button.disabled = true;
        button.textContent = "Vol!";
        button.classList.add("bg-gray-400", "cursor-not-allowed");
        button.classList.remove("bg-purple-600", "hover:bg-purple-700");
      }
    }
  }
</script>
